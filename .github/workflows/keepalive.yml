name: Keep WeChat session alive

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh WeChat session
        env:
          MP_STABLE_AUTH_KEY: ${{ secrets.MP_STABLE_AUTH_KEY }}
        run: |
          curl --fail --silent --show-error --retry 3 \
            -H "X-Auth-Key: ${MP_STABLE_AUTH_KEY}" \
            https://wx-mptext.al549984.workers.dev/api/web/mp/keepalive
